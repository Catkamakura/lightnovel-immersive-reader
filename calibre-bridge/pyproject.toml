[project]
name = "lknovel-calibre-bridge"
version = "0.1.0"
description = "Bridge between the lightnovel.fun immersive reader and Calibre-Web-Automated: imports books with rich metadata and stores/syncs reading progress + bookmarks."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "lxml>=5.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]
